# Build image qbiz milik Employr dan dorong ke GHCR. Dipicu manual atau lewat tag employr-v*.
# Semua action dikunci ke SHA commit. Naikkan secara sadar setelah memeriksa perubahannya.
name: Build Employr qbiz image

on:
  workflow_dispatch:
  push:
    tags:
      - 'employr-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qbiz-qrisdinamis:employr-${{ github.sha }}

      - name: Print digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Gunakan di server: QBIZ_IMAGE=ghcr.io/${OWNER}/qbiz-qrisdinamis@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
