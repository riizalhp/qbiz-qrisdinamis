# [EMPLOYR PATCH P8] Perbedaan dari upstream:
# - image dari registry sendiri, wajib diisi lewat QBIZ_IMAGE (disarankan pakai digest: ...@sha256:...), bukan :latest upstream
# - port Postgres TIDAK dipublikasikan (hanya dapat dijangkau dari jaringan compose)
# - port web hanya di 127.0.0.1 secara bawaan (taruh reverse proxy HTTPS di depannya)
# - variabel admin awal / webhook / sandbox diteruskan secara eksplisit
# - setiap entri environment diberi tanda kutip: pesan ":?" berisi ": " membuat YAML mengurainya sebagai map (compose upstream gagal di sini)
services:
  web:
    image: "${QBIZ_IMAGE:?QBIZ_IMAGE must be set to the digest-pinned image, see .env.example}"
    container_name: qbiz-qris-app
    restart: always
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      - "DATABASE_URL=postgres://${DB_USER:-qbiz_user}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@db:5432/${DB_NAME:-qrispaymti}"
      - "COOKIE_SECRET=${COOKIE_SECRET:?COOKIE_SECRET must be set in .env}"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}"
      - "WEBHOOK_SECRET=${WEBHOOK_SECRET:-}"
      - "BASE_URL=${BASE_URL:-}"
      - "INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}"
      - "INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}"
      - "SANDBOX_MODE=${SANDBOX_MODE:-false}"
      - "ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}"
      - "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sessions:/app/sessions
      - ./static/uploads:/app/static/uploads

  db:
    image: postgres:15-alpine
    container_name: qbiz-qris-db
    restart: always
    environment:
      - "POSTGRES_DB=${DB_NAME:-qrispaymti}"
      - "POSTGRES_USER=${DB_USER:-qbiz_user}"
      - "POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qbiz_user} -d ${DB_NAME:-qrispaymti}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
